server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Full-bleed page PNGs at >=300 DPI can approach the 20MB upload cap;
    # nginx's 1MB default would 413 before the request reaches Spring Boot.
    client_max_body_size 20M;

    # Spring Boot lives on its own container/origin inside the compose
    # network; proxying it under /api keeps the browser same-origin so no
    # CORS handling is needed in production (Section 8).
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
