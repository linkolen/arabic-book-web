server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Must stay >= Spring Boot's spring.servlet.multipart.max-request-size
    # (300MB, application.properties) -- nginx sits in front of every /api/
    # request in production, so a lower cap here 413s before Spring Boot's
    # own limit is ever reached. Bulk page-image upload sends a whole book's
    # worth of files in one request, easily exceeding the old 20MB single-
    # image-sized cap even though no individual file is large.
    client_max_body_size 300M;

    # Spring Boot lives on its own container/origin inside the compose
    # network; proxying it under /api keeps the browser same-origin so no
    # CORS handling is needed in production (Section 8).
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Gemini image generation: 120s timeout x 3 retries = ~387s worst case.
        # Story generation: 60s x 3 retries = ~187s.  PDF compose: up to 600s.
        # Set generous timeouts so none of these 504 through nginx.
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    660s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
